[project]
name = "aieditor-backend"
version = "0.1.0"
description = "AIEditor local backend: media, music analysis, frame interpolation, Gemini"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "google-genai>=1.0",
]

[project.optional-dependencies]
stems = ["demucs>=4.0"]

[project.scripts]
gen-models = "app.tools.gen_models:main"
gen-ramp-vectors = "app.tools.gen_ramp_vectors:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "datamodel-code-generator>=0.26",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/models/gen.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["app/models/gen.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
